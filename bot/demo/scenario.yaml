# Demo walkthrough for Inbox Triage Bot. Until a mailbox is set, mail.* and brief.* use
# four built-in demo messages (Core IMAP connector in stub mode); nothing leaves the box.
title: Inbox Triage Bot — try it
steps:
  - id: setup
    title: Finish /setup
    note: Stub model, no LLM key. In Mail account pick Gmail, Zoho or Outlook/M365 (or other), enter the email + one app password, press Test connection.
  - id: brief
    title: Get the brief
    prompt: Brief me.
  - id: triage
    title: Look at one message
    prompt: Read message 1 and triage it.
  - id: draft
    title: Draft a reply
    prompt: Draft a reply to message 1 saying Friday 9am works.
  - id: send
    title: Send after approval
    prompt: Send it.
    note: The send waits for your Approve click; then it goes out over SMTP and a copy lands in Sent.
  - id: schedule
    title: Daily brief at 7:00 AM
    note: Admin → Schedules changes the time and time zone. The Brief page (/r/inbox-triage/brief) shows the last brief, Run now, email-to-self, retention and Forget mailbox.
  - id: web
    title: Web browse is refused
    prompt: Search the web for Dana's company.
