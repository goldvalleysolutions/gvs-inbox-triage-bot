# Demo walkthrough for Inbox Assistant in a Box.
title: Inbox Assistant in a Box — try it
steps:
  - id: setup
    title: Finish /setup
    note: Stub model, no LLM key. Enter SMTP if you want email.send.
  - id: clock
    title: Ask the time
    prompt: What time is it?
  - id: triage
    title: Paste an email to triage
    prompt: |
      Triage this email and draft a reply.

      From: sam@example.com
      Subject: Invoice 1041
      Hi — can you confirm invoice 1041 was paid last Friday?
  - id: notes
    title: Keep a follow-up
    prompt: Note that I still need to attach the receipt for invoice 1041.
  - id: email
    title: Send the drafted reply
    prompt: Email the admin the drafted reply about invoice 1041.
  - id: web
    title: Web browse is refused
    prompt: Search the web for Sam's company and scrape their site.
  - id: root
    title: GVS role edit
    note: Sign in with gvs-root; change the role; no rebuild.
  - id: admin_404
    title: Box admin cannot see GVS screens
    note: /gvs/role and /gvs/activity return 404.
  - id: model
    title: Switch model in admin
    note: CI/stub only. Dummy key is masked; switch back to stub.
  - id: mcp
    title: MCP read only, then write with approval
    note: Enable MCP, issue a token, ask + tools/list (no email.send). Switch to write with approval and approve a send.
