# Inbox Assistant in a Box: generated by `new-box inbox-assistant`, then customized.
# Image: <ns>/inbox-assistant-in-a-box. Validate: make lint-bot BOT=<this repo>/bot (in gvs-core-bot)
# Built-ins: clock.now, notes, email.send (disabled until SMTP_* on /setup).
# Paste/provide email text only — no IMAP or POP. Web browsing is not allowed.
name: Inbox Assistant in a Box
slug: inbox-assistant
version: 0.1.0
core: "0.2"
role: role.md
skills: skills/
tools_allowed:
  - clock.now
  - notes
  - email.send
tools: tools/
connectors:
  smtp:
    mode: stub
    secrets: [SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM]
wizard: []
theme: theme.yaml
demo: demo/scenario.yaml
memory: { history_turns: 20, facts: true, retention_days: 30 }
mcp: { expose: [ask, search, list_items, email.send] }
cost: { runs: "10 chats/day", turns_per_chat: 4 }
