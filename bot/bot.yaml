# Inbox Triage Bot: generated by `make new-bot SLUG=inbox-triage`, then customized.
# Image: goldvalleysolutions/inbox-triage-bot (docker build -f bot/Dockerfile .).
# Validate: make lint-bot BOT=<this repo>/bot (in gvs-core-bot)
# Reads one mailbox over IMAP, read-only (Core connector: EXAMINE + BODY.PEEK, no flags),
# builds a daily brief (7:00 AM local, editable) and drafts replies on request.
# Sending is SMTP only, after the owner approves each send. Web browsing is not allowed.
name: Inbox Triage Bot
slug: inbox-triage
version: 0.2.0
core: "0.3"
role: role.md
skills: skills/
tools_allowed:
  - clock.now
  - notes
  - email.send
  - mail.list
  - mail.read
  - brief.build
  - brief.now
approval_required: [email.send]
tools: tools/
services: services/
connectors:
  smtp:
    mode: live
    secrets: [SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM]
  imap:
    mode: live
    secrets: [IMAP_HOST, IMAP_PORT, IMAP_SENT]
wizard: []
theme: theme.yaml
demo: demo/scenario.yaml
memory: { history_turns: 20, facts: true, retention_days: 30 }
mcp: { expose: [ask, search, list_items, email.send] }
cost: { runs: "10 chats/day + 1 brief/day", turns_per_chat: 4 }
