# Publish workflow. Merging test -> main IS the publish switch (only Mike merges to main).
# It always builds linux/amd64 + linux/arm64 FROM goldvalleysolutions/core-bot:<core> (Docker Hub).
# On push to main it pushes goldvalleysolutions/inbox-triage-bot as X.Y.Z and X.Y (version from
# bot/bot.yaml, never latest), verifies both arches, and creates GitHub release vX.Y.Z ONLY when:
#   - repo/org secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set
#   - release vX.Y.Z does not exist yet
# Otherwise it is a build-only run with a notice saying why. workflow_dispatch is ALWAYS a dry
# run (build, never push). No repo variables, no PUBLISH_ENABLED, no GHCR. Same pattern as
# gvs-core-bot .github/workflows/release.yml.
name: publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version and core from bot/bot.yaml
        id: version
        run: |
          v="$(sed -n 's/^version:[[:space:]]*//p' bot/bot.yaml | head -1 | tr -d '[:space:]\"')"
          core="$(sed -n 's/^core:[[:space:]]*//p' bot/bot.yaml | head -1 | tr -d '[:space:]\"')"
          if [[ ! "$core" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad core::'$core' in bot/bot.yaml is not X.Y"; exit 1
          fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          if [[ ! "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Bad VERSION::'$v' is not semver X.Y.Z"; exit 1
          fi
          { echo "version=$v"; echo "minor=${v%.*}"; } >> "$GITHUB_OUTPUT"

      - name: Publish or dry run?
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HAS_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          ns=goldvalleysolutions; push=false; release=false
          missing=()
          [[ "$HAS_USERNAME" == "true" ]] || missing+=("secret DOCKERHUB_USERNAME")
          [[ "$HAS_TOKEN" == "true" ]] || missing+=("secret DOCKERHUB_TOKEN")
          if [[ "$EVENT" != "push" || "$REF" != "refs/heads/main" ]]; then
            echo "::notice title=Dry run (manual run)::workflow_dispatch never publishes. Images are built for linux/amd64 + linux/arm64 but NOT pushed, and no GitHub release is created. Publishing happens only when Mike merges to main."
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice title=Already released::$TAG already exists. Bump version in bot/bot.yaml to publish; images are built but nothing is pushed."
          elif (( ${#missing[@]} )); then
            list="$(IFS=,; echo "${missing[*]}")"
            echo "::notice title=Build only (secrets missing)::${list//,/, } is missing. Images are built but not pushed, and no GitHub release is created."
          else
            push=true; release=true
          fi
          { echo "push=$push"; echo "ns=$ns"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build inbox-triage-bot (dry run, cacheonly)
        if: steps.mode.outputs.push != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bot/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          outputs: type=cacheonly
          build-args: |
            CORE=${{ steps.version.outputs.core }}
            CORE_IMAGE=goldvalleysolutions/core-bot:${{ steps.version.outputs.core }}
            IMAGE_TAG=${{ steps.mode.outputs.ns }}/inbox-triage-bot:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push inbox-triage-bot (linux/amd64, linux/arm64)
        if: steps.mode.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bot/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ steps.mode.outputs.ns }}/inbox-triage-bot:${{ steps.version.outputs.version }}
            ${{ steps.mode.outputs.ns }}/inbox-triage-bot:${{ steps.version.outputs.minor }}
          build-args: |
            CORE=${{ steps.version.outputs.core }}
            CORE_IMAGE=goldvalleysolutions/core-bot:${{ steps.version.outputs.core }}
            IMAGE_TAG=${{ steps.mode.outputs.ns }}/inbox-triage-bot:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both arches on Docker Hub
        if: steps.mode.outputs.push == 'true'
        env:
          NS: ${{ steps.mode.outputs.ns }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          for tag in "$VERSION" "$MINOR"; do
            out="$(docker buildx imagetools inspect "$NS/inbox-triage-bot:$tag")"
            echo "$out"
            grep -q "linux/amd64" <<<"$out" && grep -q "linux/arm64" <<<"$out"
          done

      - name: Create GitHub release
        if: steps.mode.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NS: ${{ steps.mode.outputs.ns }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes \
            --notes "Docker image (linux/amd64, linux/arm64): \`$NS/inbox-triage-bot:$VERSION\` (also \`:$MINOR\`). Never \`latest\`."

      - name: Summary
        if: always()
        env:
          PUSH: ${{ steps.mode.outputs.push }}
          NS: ${{ steps.mode.outputs.ns }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          {
            echo "### Release v$VERSION"
            if [[ "$PUSH" == "true" ]]; then
              echo "Pushed \`$NS/inbox-triage-bot\` as \`$VERSION\` and \`$MINOR\`."
            else
              echo "**Dry run:** built inbox-triage-bot for linux/amd64 + linux/arm64; nothing pushed, no release created (see the notice for why)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
